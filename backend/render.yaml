# Canonical production deploy config for the INO Fitness backend.
# Render is the single supported deploy target — see backend/DEPLOYMENT.md.
services:
  - type: web
    name: ino-fitness-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false   # set to the Render Postgres internal connection string
      - key: SECRET_KEY
        generateValue: true   # signs JWT access tokens (app.core.security)
      - key: JWT_SECRET
        generateValue: true   # checked by the startup env validator
      - key: ANTHROPIC_API_KEY
        sync: false   # required for AI features (workout/diet/chat/food vision)
      - key: STRIPE_SECRET_KEY
        sync: false   # required for subscriptions/payments
      - key: SENTRY_DSN
        sync: false   # optional but recommended (error monitoring)
      - key: CORS_ORIGINS
        sync: false   # comma-separated, e.g. https://app.yourdomain.com
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: REDIS_URL
        sync: false   # optional; without it rate limiting/Celery degrade gracefully
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: ino-fitness-db
    plan: free
    region: oregon
    databaseName: ino_fitness
    user: ino
